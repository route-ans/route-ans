basePath: /v1
definitions:
  github_com_route-ans_route-ans_internal_resolver.CheckResult:
    properties:
      details:
        additionalProperties: true
        description: Details contains additional check-specific details
        type: object
      duration:
        description: Duration is how long the check took (in nanoseconds)
        type: integer
      message:
        description: Message contains a human-readable message
        type: string
      name:
        description: Name is the check name
        type: string
      passed:
        description: Passed indicates if the check passed
        type: boolean
      required:
        description: Required indicates if this check is required for overall success
        type: boolean
    type: object
  internal_server.BatchResolveRequest:
    properties:
      names:
        items:
          type: string
        type: array
    type: object
  internal_server.BatchResolveResponse:
    properties:
      results:
        additionalProperties:
          $ref: '#/definitions/internal_server.ResolutionResponse'
        type: object
    type: object
  internal_server.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
  internal_server.ResolutionResponse:
    properties:
      agent:
        type: string
      cached:
        type: boolean
      certFingerprint:
        type: string
      endpoint:
        type: string
      error:
        type: string
      expiresAt:
        type: string
      protocol:
        type: string
      protocolExtensions:
        additionalProperties: true
        type: object
      status:
        type: string
    type: object
  internal_server.VerifyResponse:
    properties:
      checks:
        additionalProperties:
          $ref: '#/definitions/github_com_route-ans_route-ans_internal_resolver.CheckResult'
        type: object
      valid:
        type: boolean
      verifiedAt:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Route ANS Team
    url: https://github.com/route-ans/route-ans
  description: High-performance, cryptographically-verified resolution of ANSName
    identifiers to agent endpoints.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  termsOfService: https://github.com/route-ans/route-ans
  title: ANS Resolution Server API
  version: 1.0.0
paths:
  /agent/{ansName}:
    get:
      description: Returns detailed information about a specific agent
      parameters:
      - description: The ANSName of the agent
        in: path
        name: ansName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.ResolutionResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      summary: Get agent details
      tags:
      - Agents
  /agent/{ansName}/verify:
    get:
      description: Performs cryptographic verification of an agent's registration
      parameters:
      - description: The ANSName of the agent to verify
        in: path
        name: ansName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.VerifyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      summary: Verify an agent
      tags:
      - Agents
  /agent/{ansName}/versions:
    get:
      description: Returns all registered versions of an agent
      parameters:
      - description: The ANSName of the agent
        in: path
        name: ansName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      summary: List agent versions
      tags:
      - Agents
  /discover:
    get:
      description: Discover agents based on their capabilities
      parameters:
      - description: Text search query
        in: query
        name: q
        type: string
      - description: Filter by protocol
        in: query
        name: protocol
        type: string
      - description: Filter by capability
        in: query
        name: capability
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      summary: Discover agents by capability
      tags:
      - Discovery
  /health:
    get:
      description: Returns the health status of the server
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - Health
  /ready:
    get:
      description: Returns whether the server is ready to accept requests
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Readiness check
      tags:
      - Health
  /resolve:
    get:
      description: Resolves an ANSName identifier to its verified endpoint
      parameters:
      - description: The full ANSName to resolve
        example: mcp://agent.example.com
        in: query
        name: name
        required: true
        type: string
      - description: Bypass cache and force fresh lookup
        in: query
        name: force
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.ResolutionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      summary: Resolve an ANSName
      tags:
      - Resolution
  /resolve/batch:
    post:
      consumes:
      - application/json
      description: Resolves multiple ANSName identifiers in a single request
      parameters:
      - description: Batch resolve request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_server.BatchResolveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_server.BatchResolveResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      summary: Batch resolve ANSNames
      tags:
      - Resolution
  /search:
    get:
      description: Search for agents by text, protocol, capability, or status
      parameters:
      - description: Text search query
        in: query
        name: q
        type: string
      - description: Filter by protocol (a2a, mcp, acp, https)
        in: query
        name: protocol
        type: string
      - description: Filter by capability
        in: query
        name: capability
        type: string
      - description: Filter by status (active, revoked)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      summary: Search for agents
      tags:
      - Discovery
  /stats:
    get:
      description: Returns statistics about the resolver's operation
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_server.ErrorResponse'
      summary: Get resolver statistics
      tags:
      - Stats
schemes:
- http
- https
swagger: "2.0"
