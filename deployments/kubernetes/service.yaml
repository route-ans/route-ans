apiVersion: v1
kind: Service
metadata:
  name: ans-resolver
  namespace: route-ans
  labels:
    app: ans-resolver
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
  selector:
    app: ans-resolver
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ans-resolver
  namespace: route-ans
  labels:
    app: ans-resolver
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ans-resolver
  namespace: route-ans
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: ans-resolver
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ans-resolver
  namespace: route-ans
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ans-resolver
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
